name: Build Windows

# 打 v* 标签或手动触发时，在 Windows 上运行一键打包脚本，产出可分发的 exe/zip。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish & package
        shell: powershell
        run: .\build-release.ps1

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClassRTTranslator-Windows
          path: dist/

      - name: Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ClassRTTranslator-Windows-x64.zip
            dist/ClassRTTranslator-Windows-x64.sha256
          generate_release_notes: true
